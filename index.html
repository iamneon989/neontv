<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HLS Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  background: black;
}

.player-container {
  width: 100%;
  height: 100vh;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;   /* Normal mode */
  background: black;
}

/* 🔥 When Fullscreen */
video:fullscreen {
  object-fit: cover;     /* Fill screen only in fullscreen */
}

video:-webkit-full-screen {
  object-fit: cover;     /* Safari support */
}
</style>
</head>

<body>
  <p style="color:white;">⚠️We do not host any content on our servers. All the links in this file are collected from public sources.</p>
<div class="player-container">
  <video id="video" controls autoplay playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const video = document.getElementById("video");

const m3u8Url = "https://vod01.akt.hotstar-cdn.net/videos/cricket/inallow-ipl-2026-1540067597/1540067598/28d8061f724740ad8ac9437a7ab42a22/index_7.m3u8";

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(m3u8Url);
  hls.attachMedia(video);
} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
  video.src = m3u8Url;
}
</script>

</body>
</html>
